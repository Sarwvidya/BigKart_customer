name: Build Docker Image

on:
  workflow_run:
    workflows: ["Build JAR"]
    types:
      - completed
  workflow_dispatch: # Allows manual triggering if needed

jobs:
  docker:
    # Only run if triggered manually OR if the triggering workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Download JAR artifact from triggering workflow (or latest run)
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: bigkart-jar
          path: target
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build and Push in a single step
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smallkart_customer:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smallkart_customer:${{ github.sha }}
