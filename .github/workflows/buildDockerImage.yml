name: Build Docker Image

# 🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀
# 🔗 This workflow starts AFTER the "Build JAR" workflow finishes
# 📦 Build JAR → JAR Artifact → THIS WORKFLOW → Docker Image → Docker Hub
# 🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀🚀

on:
  workflow_dispatch:

jobs:
  docker:

    # ✅ Only continue if the Build JAR workflow succeeded
    # ❌ If Maven/JAR build failed → Docker workflow stops here
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:

      # ============================================================
      # 1️⃣ 1️⃣ 1️⃣  CHECKOUT SOURCE CODE  1️⃣ 1️⃣ 1️⃣
      # ============================================================
      # 📥 Downloads your GitHub repository into the GitHub Actions runner
      #
      # Repository:
      #
      # bigkart_customer/
      # ├── src/
      # ├── pom.xml
      # ├── Dockerfile
      # └── .github/
      #
      # ⚠️ The JAR is NOT in the repository because target/ is gitignored.
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v6


      # ============================================================
      # 2️⃣ 2️⃣ 2️⃣  DOWNLOAD JAR ARTIFACT  2️⃣ 2️⃣ 2️⃣
      # ============================================================
      # 📦 The previous "Build JAR" workflow created:
      #
      # target/bigkart-0.0.1-SNAPSHOT.jar
      #
      # It uploaded that JAR as:
      #
      # GitHub Artifact → "bigkart-jar"
      #
      # This step downloads that artifact from the workflow run
      # that triggered this workflow.
      # ============================================================

      - name: Download JAR
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });

            const artifact = artifacts.data.artifacts.find(
              artifact => artifact.name === 'bigkart-jar'
            );

            if (!artifact) {
              core.setFailed('bigkart-jar artifact not found');
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            });

            require('fs').writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/artifact.zip`,
              Buffer.from(download.data)
            );

            require('child_process').execSync(
              'unzip -o artifact.zip -d target'
            );


      # ============================================================
      # 3️⃣ 3️⃣ 3️⃣  BUILD DOCKER IMAGE  3️⃣ 3️⃣ 3️⃣
      # ============================================================
      # 🐳 Docker now has:
      #
      # Dockerfile
      # target/
      # └── bigkart-0.0.1-SNAPSHOT.jar
      #
      # Dockerfile does:
      #
      # FROM eclipse-temurin:17-jre
      # WORKDIR /app
      # COPY target/bigkart-0.0.1-SNAPSHOT.jar app.jar
      #
      # Result:
      #
      # 🐳 bigkart:latest
      # ============================================================

      - name: Build Docker image
        run: docker build -t bigkart:latest .


      # ============================================================
      # 4️⃣ 4️⃣ 4️⃣  LOGIN TO DOCKER HUB  4️⃣ 4️⃣ 4️⃣
      # ============================================================
      # 🔐 Login using GitHub Repository Secrets.
      #
      # DOCKERHUB_USERNAME → sarwvidya
      # DOCKERHUB_TOKEN    → your Docker Hub PAT
      #
      # ⚠️ The actual token is NEVER written in this workflow.
      # ============================================================

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ============================================================
      # 5️⃣ 5️⃣ 5️⃣  TAG DOCKER IMAGE  5️⃣ 5️⃣ 5️⃣
      # ============================================================
      # 🏷️ Current local image:
      #
      # bigkart:latest
      #
      # Docker Hub image name:
      #
      # sarwvidya/bigkart_customer:latest
      #
      # This command gives our local image its Docker Hub name.
      # ============================================================

      - name: Tag Docker image
        run: docker tag bigkart:latest ${{ secrets.DOCKERHUB_USERNAME }}/bigkart_customer:latest


      # ============================================================
      # 6️⃣ 6️⃣ 6️⃣  PUSH IMAGE TO DOCKER HUB  6️⃣ 6️⃣ 6️⃣
      # ============================================================
      # ☁️ Uploads the Docker image from the temporary
      # GitHub Actions runner to Docker Hub.
      #
      # BEFORE:
      #
      # GitHub Actions runner
      # └── Docker
      #     └── sarwvidya/bigkart_customer:latest
      #
      # AFTER:
      #
      # Docker Hub
      # └── sarwvidya/bigkart_customer:latest
      #
      # 🎉 The image is now permanently stored in Docker Hub.
      # ============================================================

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/bigkart_customer:latest
